<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Nerve | Wireframe Playtest V4</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#181818;background:#e9e9e9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}.shell{width:min(100%,480px);height:100dvh;margin:auto;display:flex;flex-direction:column;background:#f7f7f7;border-inline:1px solid #999;overflow:hidden}.top{padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:17px;font-weight:900;letter-spacing:-.06em}.stamp{font-size:10px;border:1px solid #555;padding:6px}.bar{padding:11px 18px 8px}.barline{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.05em}.track{margin-top:7px;height:5px;border:1px solid #333}.fill{height:100%;width:0%;background:#222;transition:width .3s}.status{font-size:10px;line-height:1.5;display:flex;gap:8px;flex-wrap:wrap;padding-top:9px}.status span{border:1px solid #777;padding:3px 5px}.main{flex:1;min-height:0;padding:8px 17px 10px;display:flex;flex-direction:column;gap:9px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em}.stage{position:relative;min-height:0;flex:1;display:flex}.card{width:100%;height:100%;border:2px solid #171717;background:#fff;padding:clamp(15px,3.2vh,25px);display:flex;flex-direction:column;justify-content:space-between;touch-action:pan-y;user-select:none;will-change:transform,opacity;box-shadow:5px 5px 0 #d7d7d7}.card.dragging{transition:none}.card.fly{transition:transform .23s ease-in,opacity .23s ease-in;opacity:0}.tag{font-size:10px;border:1px solid #777;display:inline-block;padding:5px 7px;align-self:flex-start}.body{font-size:clamp(16px,2.55vh,22px);font-family:Arial,Helvetica,sans-serif;line-height:1.32;font-weight:600;white-space:pre-line;overflow:auto;min-height:0;padding-block:12px}.title{font-size:clamp(19px,3.2vh,27px);letter-spacing:-.045em;font-weight:900;margin:0 0 8px}.dragcue{text-align:center;font-size:10px;color:#777;padding-top:6px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}.choose{padding:11px 8px;border:1.5px solid #222;min-height:70px;background:#fff;font-size:clamp(10px,1.6vh,12px);font-weight:800;text-transform:uppercase;line-height:1.25}.choose:active{background:#ddd}.footer{padding:4px 17px calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;justify-content:space-between;font-size:10px}.footer button{background:none;border:0;text-decoration:underline;font-size:10px;padding:5px}.veil{display:none;position:fixed;inset:0;z-index:5;background:#1119;align-items:center;justify-content:center;padding:24px}.veil.on{display:flex}.popup{width:min(100%,410px);background:#fdfdfd;border:2px solid #111;box-shadow:8px 8px 0 #333;padding:19px;animation:drop .2s ease-out}.popuphead{display:flex;justify-content:space-between;border-bottom:1px solid #aaa;padding-bottom:8px;font-size:10px}.popup h2{font:900 21px Arial,Helvetica,sans-serif;margin:18px 0 10px}.popup p{font:15px/1.45 Arial,Helvetica,sans-serif;white-space:pre-line}.popup button,.endbutton{width:100%;padding:14px;border:2px solid #111;background:#fff;font-weight:900;margin-top:12px}.end{height:100%;border:2px solid #111;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:#fff}.end h1{font:900 clamp(28px,5vh,44px)/.98 Arial,sans-serif;letter-spacing:-.05em}.end p{font:16px/1.4 Arial,sans-serif;white-space:pre-line;overflow:auto}.endstats{font-size:11px;line-height:1.8;border-block:1px solid #aaa;padding:10px 0}.toggle{border:1px solid #444;background:#fff;padding:4px 6px;font-size:10px}@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}@media(max-height:640px){.main{gap:6px}.bar{padding-block:6px}.status{padding-top:5px}.choose{min-height:54px}.top{padding-top:calc(env(safe-area-inset-top) + 7px)}}

/* V3 / black paper wireframe */
:root{color:#fff;background:#000;color-scheme:dark}
html,body{background:#000}
.shell{background:#050505;color:#fff;border-inline:1px solid #444}
.top{border-color:#555}.stamp{border-color:#777}.barline{color:#ccc}.track{border-color:#aaa;background:#111}.fill{background:#f1f1f1}
.eyebrow{color:#aaa}.card{background:#0b0b0b;border:1px solid #eee;box-shadow:5px 5px 0 #333}
.tag{border-color:#666;color:#aaa}.dragcue{color:#aaa}.choose{background:#080808;color:#fff;border:1px solid #aaa}.choose:active{background:#333}.footer{color:#aaa}.footer button,.toggle{color:#fff;background:#050505;border-color:#555}
.veil{background:#000b}.popup{color:#111;background:#efefef;border:2px solid #fff;box-shadow:8px 8px 0 #666}.popuphead{border-color:#999}.popup button{color:#111;background:#fff}.end{background:#090909;color:#fff;border-color:#eee}.endstats{border-color:#777}.endbutton{background:#fff;color:#111}.end p{color:#eee}.subscribe{border-top:1px solid #777;margin-top:12px;padding-top:12px;font:12px/1.55 Arial,Helvetica,sans-serif}.subscribe strong{font-weight:900}.body{white-space:pre-line}
.stage::after{content:'';pointer-events:none;position:absolute;right:7px;bottom:6px;width:110px;height:58px;background-image:radial-gradient(circle,#777 1px,transparent 1.4px);background-size:7px 7px;mask-image:linear-gradient(to bottom left,#000,transparent);opacity:.22}
.end{background-image:radial-gradient(circle at 85% 15%,#555 1px,transparent 1.5px);background-size:9px 9px;background-repeat:repeat;background-color:#080808;background-blend-mode:screen}
@media(max-height:700px){.end{padding:13px}.end h1{font-size:clamp(24px,4vh,33px)}.end p{font-size:14px}}
</style></head><body>
<div class="shell"><header class="top"><div class="logo">THE NERVE <span style="font-weight:400">/ GAME</span></div><div class="stamp">WIREFRAME · V4</div></header><section class="bar"><div class="barline"><span>THE NERVE / PLAYTEST</span><span id="progress">0 / 7</span></div><div class="track"><div id="fill" class="fill"></div></div></section><main class="main"><div class="eyebrow" id="sceneLabel">DECISION 01 / 07</div><div class="stage" id="stage"></div><div class="choices" id="choices"></div></main><footer class="footer"><span>← SWIPE OR TAP →</span><span><button class="toggle" id="sound">SOUND ON</button> <button id="restart">RESTART</button></span></footer></div>
<div class="veil" id="veil" role="dialog" aria-modal="true"><section class="popup"><div class="popuphead"><strong id="popupSource">INCOMING MESSAGE</strong><span>● NEW</span></div><h2 id="popupTitle"></h2><p id="popupBody"></p><button id="popupClose">DISMISS →</button></section></div>
<script>
// THE NERVE / PLAYTEST V4. Narrative/copy lives here; no external libraries.
const chapters=[{"id": "tip", "title": "2:13 AM. UNKNOWN NUMBER.", "body": "“He’s selling your private data. I have proof.”\n\nA file lands on your phone. Anonymous. Unverified.\n\nYour editor wants a scoop. Your phone has all your contacts on it.", "choices": [["OPEN THE FILE", "open"], ["CHECK THE FILE", "isolate"]]}, {"id": "proof", "title": "THE BILLIONAIRE KNOWS.", "body": "The files suggest a massive data sale. But a crucial page is missing.\n\nYour editor wants it out before anyone else gets there. The billionaire has 40 million followers and an army of lawyers.", "choices": [["POST THE STORY", "post"], ["FIND THE PROOF", "verify"]]}, {"id": "source", "title": "YOUR ONLY SOURCE.", "body": "Your whistleblower is terrified. They will talk only if you promise to keep their identity secret.\n\nYour editor wants a name on the record. Your source says one wrong move could ruin their life.", "choices": [["NAME YOUR SOURCE", "record"], ["KEEP THEM SECRET", "protect"]]}, {"id": "home", "title": "YOUR ANNIVERSARY. AGAIN.", "body": "Your partner has booked dinner. You promised you would be there this time.\n\nYour source messages: “They’re following me. Meet me now.”\n\nTwo people need you. You can only choose one.", "choices": [["GO TO DINNER", "home"], ["MEET YOUR SOURCE", "meet"]]}, {"id": "funding", "title": "THE HOUSE OR THE STORY.", "body": "The billionaire’s lawyers threaten to bankrupt The Nerve. Your publisher can’t risk the bill.\n\nYou could put your own home up as security to keep the investigation alive. You haven’t told your partner.", "choices": [["BURY THE STORY", "bury"], ["RISK YOUR HOUSE", "self"]]}, {"id": "threat", "title": "YOUR ADDRESS IS ONLINE.", "body": "Your address has been posted. The threats are arriving faster than you can read them.\n\nPolice tell you to get your family somewhere safe. Your editor says publication is close.", "choices": [["GET THEM OUT", "safe"], ["STAY ON THE STORY", "continue"]]}, {"id": "final", "title": "11:58 PM. TWO MINUTES.", "body": "The investigation is ready. An emergency court order lands on your desk. Your lawyer says they need ten minutes to check it.\n\nThe billionaire is already telling the world you’ve backed down.", "choices": [["HIT PUBLISH", "now"], ["CALL YOUR LAWYER", "check"]]}];
const consequence={"open": {"security": -1, "alert": ["DEVICE SECURITY", "Suspicious file opened", "Your phone flags possible malware. Your source replies: “On your PERSONAL phone? Seriously?”"]}, "isolate": {"evidence": 1, "alert": ["SECURE FILE", "Attachment isolated", "The file opens in a safe environment. Your editor: “Is that the best you can do for a headline?”"]}, "post": {"evidence": -2, "reach": 1, "alert": ["SOCIAL NOTIFICATION", "You are trending", "The billionaire calls you a liar to 40 million followers. His lawyers want to know where your missing evidence is."]}, "verify": {"evidence": 2, "alert": ["EDITOR · 3 MISSED CALLS", "Where’s my story?", "“Another outlet is sniffing around. Tell me you have something.”"]}, "record": {"source": -2, "alert": ["ENCRYPTED MESSAGE", "User deleted", "Your source has vanished. The last message reads: “You promised.”"]}, "protect": {"source": 2, "alert": ["ENCRYPTED MESSAGE", "Location shared", "“Thank you. I’m sending the rest. Please don’t let them find me.”"]}, "home": {"family": 2, "source": -2, "alert": ["ENCRYPTED MESSAGE", "Message undelivered", "“They found me.” Your source’s number is now disconnected."]}, "meet": {"source": 2, "family": -2, "alert": ["MESSAGE · PARTNER", "I’ve changed the locks", "“Hope your source was worth our anniversary.”"]}, "bury": {"evidence": -3, "security": 2, "alert": ["EMAIL · EDITOR", "Story shelved", "The Nerve pulls the investigation. An hour later the billionaire posts: “Another fake-news hit job defeated.”"]}, "self": {"security": -1, "family": -2, "evidence": 1, "alert": ["BANK ALERT", "Mortgage application submitted", "A joint-account notification lands on your partner’s phone. Three dots appear. Then disappear."]}, "safe": {"security": 2, "family": 1, "reach": -1, "alert": ["MESSAGE · EDITOR", "Where are you?", "“We can hold publication. Just tell me when your family’s safe.”"]}, "continue": {"security": -2, "reach": 1, "alert": ["UNKNOWN NUMBER", "New photograph received", "It’s your front door. Taken five minutes ago."]}, "now": {"security": -3, "reach": 2, "alert": ["LEGAL DEPARTMENT", "URGENT: STOP", "“The order applies to material in your story. Call us. NOW.”"]}, "check": {"security": 2, "reach": -1, "alert": ["LEGAL DEPARTMENT", "Cleared to publish", "“Two lines need removing. The rest stands. Hit publish.”"]}};
let i=0,values={},history=[],sound=true,modalQueue=[],locked=false,audioCtx=null;
const byId=x=>document.getElementById(x);
function init(){i=0;values={evidence:0,source:0,security:0,family:0,reach:0};history=[];modalQueue=[];locked=false;byId('veil').classList.remove('on');render()}
function beep(){if(!sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let osc=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;osc.frequency.value=860;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);osc.connect(g).connect(audioCtx.destination);osc.start(t);osc.stop(t+.15)}catch(e){}}
function notify(source,title,body){modalQueue.push({source,title,body});showNext()}
function showNext(){if(!modalQueue.length||byId('veil').classList.contains('on'))return;let p=modalQueue.shift();byId('popupSource').textContent=p.source;byId('popupTitle').textContent=p.title;byId('popupBody').textContent=p.body;byId('veil').classList.add('on');beep()}
byId('popupClose').onclick=()=>{byId('veil').classList.remove('on');setTimeout(showNext,90)};
function updateStatus(){byId('progress').textContent=Math.min(i+1,chapters.length)+' / '+chapters.length;byId('fill').style.width=(Math.min(i+1,chapters.length)/chapters.length*100)+'%'}
function render(){updateStatus();if(i>=chapters.length){finish();return;}let s=chapters[i];byId('sceneLabel').textContent=`DECISION ${String(i+1).padStart(2,'0')} / ${String(chapters.length).padStart(2,'0')}`;let card=document.createElement('article');card.className='card';card.id='card';let tag=document.createElement('div');tag.className='tag';tag.textContent='[ THE NERVE / '+s.id.toUpperCase()+' ]';let body=document.createElement('div');body.className='body';let h=document.createElement('h1');h.className='title';h.textContent=s.title;body.append(h,document.createTextNode(s.body));let cue=document.createElement('div');cue.className='dragcue';cue.textContent='SWIPE LEFT OR RIGHT';card.append(tag,body,cue);byId('stage').replaceChildren(card);byId('choices').replaceChildren();s.choices.forEach(([label],n)=>{let b=document.createElement('button');b.className='choose';b.textContent=(n?'→ ':'← ')+label;b.onclick=()=>choose(n);byId('choices').append(b)});let x=0,drag=false;card.addEventListener('pointerdown',e=>{drag=true;x=e.clientX;card.setPointerCapture(e.pointerId);card.classList.add('dragging')});card.addEventListener('pointermove',e=>{if(!drag)return;let d=e.clientX-x;card.style.transform=`translateX(${Math.max(-130,Math.min(130,d))}px) rotate(${d/28}deg)`});card.addEventListener('pointerup',e=>{if(!drag)return;drag=false;card.classList.remove('dragging');let d=e.clientX-x;if(Math.abs(d)>60)choose(d<0?0:1);else card.style.transform=''});card.addEventListener('pointercancel',()=>{drag=false;card.style.transform=''})}
function choose(n){if(locked||i>=chapters.length)return;locked=true;let chapter=chapters[i],effect=consequence[chapter.choices[n][1]],el=byId('card');history.push({scene:chapter.id,choice:chapter.choices[n][0],code:chapter.choices[n][1]});for(let k of Object.keys(values))values[k]+=effect[k]||0;el.style.transform=`translateX(${n?'+':'-'}125vw) rotate(${n?16:-16}deg)`;el.classList.add('fly');setTimeout(()=>{i++;render();locked=false;if(effect.alert)notify(...effect.alert)},245)}
function finish(){byId('sceneLabel').textContent='OUTCOME / HAVE YOU GOT THE NERVE?';byId('choices').replaceChildren();let score=values.evidence+values.source+values.security;let abandoned=history.some(h=>h.code==='bury');let reckless=values.evidence<0||values.security<=-4;let published=!abandoned&&score>=2&&values.evidence>=0&&!reckless;let kind=published?'story':abandoned||reckless?'implodes':'partial';let rating={story:100,partial:60,implodes:0}[kind];let headline={story:'THE STORY GETS OUT',partial:'ONLY HALF THE TRUTH',implodes:'THE STORY IMPLODES'}[kind];let desc={story:'You got the story out. The evidence holds. The billionaire has questions to answer.',partial:'You got part of the story out. Some of the truth is still buried. The billionaire knows it.',implodes:abandoned?'You walked away. The story stays buried. The billionaire barely notices.':'The story collapses under legal pressure or shaky evidence. The billionaire makes your reporting the headline.'}[kind];let family=values.family<=-2?'At home, there’s a message: “We need to talk.”':values.family>0?'Your partner is still speaking to you. That’s something.':'Your partner hasn’t replied.';let src=values.source<0?'Your source has disappeared.':'Your source is still protected. For now.';let house=history.some(h=>h.code==='self')?'You’ve also put your home on the line.':'';let stage=document.createElement('section');stage.className='end';let first=document.createElement('div');let tag=document.createElement('div');tag.className='tag';tag.textContent='[ THE COST OF THE TRUTH ]';let h=document.createElement('h1');h.textContent=headline;let p=document.createElement('p');p.textContent=[desc,family,src,house].filter(Boolean).join('\n\n');first.append(tag,h,p);let last=document.createElement('div');let stats=document.createElement('div');stats.className='endstats';stats.innerHTML='YOUR NERVE RATING <strong>'+rating+'%</strong><br>BASED ON YOUR OUTCOME, NOT YOUR SWIPE COUNT.';let ask=document.createElement('div');ask.className='subscribe';ask.innerHTML='<strong>HAVE YOU GOT THE NERVE?</strong><br>Real journalists face the consequences every day.<br><strong>Subscribe to The Nerve. Help keep the truth coming.</strong>';let btn=document.createElement('button');btn.className='endbutton';btn.textContent='PLAY AGAIN ↻';btn.onclick=init;last.append(stats,ask,btn);stage.append(first,last);byId('stage').replaceChildren(stage);byId('progress').textContent=chapters.length+' / '+chapters.length;byId('fill').style.width='100%';notify('EMAIL · EDITOR',published?'Subject: It’s live':'Subject: Where do we go from here?',published?'The story is everywhere. You did it.':'We need to talk about what happens next.')}
byId('restart').onclick=init;byId('sound').onclick=()=>{sound=!sound;byId('sound').textContent=sound?'SOUND ON':'SOUND OFF';if(sound)beep()};init();
</script></body></html>
