<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Have You Got The Nerve? | Playtest</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f5f4ee;background:#111410}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0,#2b3328,#10120f 66%);display:flex;align-items:center;justify-content:center}button{font:inherit;cursor:pointer}.app{width:min(100%,470px);min-height:100dvh;background:#e8edb6;color:#151a12;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 80px #0007}.head{padding:23px 24px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:-.03em;border-bottom:2px solid #182217}.brand{font-size:22px;line-height:.9}.pill{border:2px solid #1b2519;border-radius:30px;padding:7px 11px;font:800 10px Arial;letter-spacing:.1em}.meter{padding:15px 24px 0}.meterline{display:flex;justify-content:space-between;font-weight:900;font-size:10px;letter-spacing:.15em;margin-bottom:8px}.track{height:8px;border:1px solid #172113;background:#cfdaa1;overflow:hidden}.fill{height:100%;width:0%;background:#18281a;transition:width .25s}.step{font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.16em;margin:34px 24px 12px}.card{margin:0 19px;background:#1b2a1f;color:#f1f6d8;padding:30px 25px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;transform:translateX(0);transition:transform .18s;touch-action:pan-y}.tag{color:#d5f45e;font-weight:900;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.story{font-size:clamp(21px,5.5vw,27px);font-weight:800;letter-spacing:-.045em;line-height:1.15;white-space:pre-line;margin:25px 0}.hint{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.1em}.choices{margin:16px 19px 0;display:grid;grid-template-columns:1fr 1fr;gap:11px}.choice{min-height:87px;background:#e8edb6;color:#1a281c;border:2px solid #1b2a1f;padding:13px 10px;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:-.02em}.choice.right{background:#daf05e}.choice:active{transform:scale(.98)}.foot{margin:auto 22px 22px;padding-top:26px;font-size:11px;line-height:1.5;display:flex;justify-content:space-between;gap:10px;color:#3b4337}.restart{border:0;background:transparent;text-decoration:underline;font-weight:bold;padding:0;color:inherit}.overlay{position:absolute;inset:0;background:#111a12ae;display:none;align-items:center;justify-content:center;padding:22px;z-index:4}.overlay.active{display:flex}.notification{background:#f7f7f3;color:#151515;border-radius:18px;width:100%;padding:19px 20px;box-shadow:0 24px 60px #0009;animation:pop .25s ease-out}.notification .label{font-size:11px;font-weight:900;letter-spacing:.12em;color:#536057}.notification h2{font-size:22px;margin:14px 0 8px;letter-spacing:-.04em}.notification p{font-size:15px;line-height:1.4;white-space:pre-line}.notification button{background:#172719;color:white;padding:14px 19px;border:0;margin-top:14px;font-weight:900;width:100%}@keyframes pop{from{transform:translateY(-25px);opacity:0}to{transform:translateY(0);opacity:1}}.ending{background:#1b2a1f;color:#f0f3dc;margin:0 19px;padding:30px 25px}.ending h2{font-size:36px;letter-spacing:-.065em;line-height:1;margin:0 0 20px}.ending p{white-space:pre-line;line-height:1.45;font-size:17px}.ending button{background:#d7f15b;border:0;padding:18px;font-weight:900;width:100%;margin-top:25px}.small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.7}#debug{display:none} @media(min-width:600px){.app{min-height:860px;max-height:95vh;border-radius:10px}.story{font-size:25px}}
</style></head><body><main class="app"><div class="head"><div class="brand">THE<br>NERVE<span style="color:#78a81d">.</span></div><div class="pill">PLAYTEST 01</div></div><div id="meter" class="meter"><div class="meterline"><span>STORY PRESSURE</span><span id="progress">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></div><div id="playarea" aria-live="polite"></div><footer class="foot"><span>Swipe left or right, or tap a choice.<br>Fictional prototype inspired by journalism.</span><button class="restart" id="reset">Start again</button></footer><div class="overlay" id="overlay"><div class="notification" role="alertdialog" aria-modal="true"><div class="label" id="poplabel"></div><h2 id="poptitle"></h2><p id="poptext"></p><button id="popclose">CONTINUE</button></div></div></main><script>
// EDIT THE STORY HERE. Each choice leads to another scene or ending.
const scenes={
 intro:{title:'HAVE YOU GOT THE NERVE?',body:'You’re an investigative journalist at The Nerve. A tip-off could expose one of the most powerful men in tech.\n\nThe story could change everything. Including your life.\n\nTwo choices at every turn. Neither entirely comfortable.',options:[['PLAY','tip'],['PLAY','tip']]},
 tip:{title:'THE TIP-OFF',body:'2:13am. Your phone lights up.\n\nUNKNOWN: “He’s selling people’s private data. I’ve got proof. But you need to move fast.”\n\nThere’s an attachment. No name. No explanation.',options:[['DELETE IT. GO BACK TO SLEEP','lost'],['OPEN THE FILE','social']],pop:{title:'Security alert',label:'DEVICE SECURITY',body:'Suspicious attachment detected. This file may contain malware.',when:'right'}},
 social:{title:'THE FIRST LEAD',body:'You start digging. Screenshots, rumours and deleted posts. Enough smoke to make you curious. Not enough evidence to print.\n\nThe billionaire has 40 million followers and a very short fuse.',options:[['POST WHAT YOU’VE FOUND','blocked'],['CHECK THE EVIDENCE','threat']]},
 threat:{title:'THE FIRST THREAT',body:'The documents check out. It’s real.\n\nYour editor wants the story yesterday.\n\nThen a letter lands from the billionaire’s lawyers. Publish, they warn, and they’ll sue The Nerve into the ground.',options:[['PAUSE. GET LEGAL COVER','pause'],['KEEP INVESTIGATING','editor']]},
 editor:{title:'CALL FROM THE EDITOR',body:'Your editor is delighted. The lawyers, less so.\n\nYou find more evidence that people’s data has been sold. Then your source messages again:\n\n“We need to talk. Not on here.”',options:[['CALL FOR A PUBLIC INQUIRY','inquiry'],['KEEP DIGGING','source']]},
 source:{title:'THE SOURCE',body:'Your whistleblower agrees to meet, but only on one condition.\n\n“You never tell anyone who I am. Not even your editor.”\n\nThey sound terrified. You’re running out of time.',options:[['INSIST THEY GO ON RECORD','ghosted'],['PROMISE TO PROTECT THEM','witness']]},
 witness:{title:'MEET THE WITNESS',body:'They slide a folder across the table. Their hands are shaking.\n\nInside: records of secret meetings, payments and favours.\n\nYou have a huge story. You also have someone’s life in your hands.',options:[['PUBLISH NOW','hoax'],['CHECK THEIR STORY FIRST','larger']]},
 larger:{title:'THE LARGER STORY',body:'The witness has been lying. But one detail in their story leads somewhere unexpected: a political connection nobody has looked at.',options:[['PUBLISH WHAT YOU CAN PROVE','partial'],['FOLLOW THE NEW LEAD','marriage']]},
 marriage:{title:'THE MARRIAGE',body:'Your partner calls.\n\n“You missed our anniversary. Again.”\n\nYou promised this time would be different.\n\nThen your source sends the file that could bring down the entire company.',options:[['GO HOME. YOU’VE PROMISED','partial'],['STAY. THE SOURCE IS WAITING','money']],pop:{label:'CALENDAR',title:'Anniversary dinner',body:'7:30pm · Table for two\n\nMessage: “I’ve booked us a table, babe x”',when:'enter'}},
 money:{title:'THE MONEY',body:'The billionaire’s lawyers are threatening a lawsuit that could finish The Nerve.\n\nYour publisher can’t cover the legal costs.\n\nYou could remortgage your home. There’s £60,000 of equity. Your partner doesn’t know you’re considering it.',options:[['STOP. DON’T RISK THE HOUSE','partial'],['PUT YOUR HOME ON THE LINE','offer']]},
 offer:{title:'THE OFFER',body:'A fixer for the billionaire calls with an offer: £250,000 if you walk away.\n\n“Consultancy fee,” he says. “No one needs to know.”\n\nIt would pay off the mortgage. And end the threats.',options:[['TAKE THE DEAL. END THIS','bought'],['TURN IT DOWN. KEEP GOING','doxxed']]},
 doxxed:{title:'DEATH THREATS',body:'Your home address appears online.\n\nStrangers are threatening your family. Your phone won’t stop buzzing.\n\nYour editor says the story is nearly ready. Your family wants you to stop.',options:[['STOP. PROTECT YOUR FAMILY','partial'],['GO ON. YOU’RE SO CLOSE','injunction']],pop:{label:'UNKNOWN SENDERS',title:'Your inbox is exploding',body:'“We know where you live.”\nEDITOR: “Need a decision NOW.”\nPARTNER: “What the fuck is this?”',when:'enter'}},
 injunction:{title:'THE LAST-MINUTE INJUNCTION',body:'11:58pm. Two minutes until publication.\n\nAn emergency court order arrives, attempting to stop the story.\n\nYour lawyer says: “Do not press publish until we’ve checked what this actually prevents.”\n\nThe newsroom goes silent.',options:[['PUBLISH. NO ONE STOPS YOU','reckless'],['CHECK THE ORDER FIRST','win']],pop:{label:'LEGAL TEAM',title:'URGENT',body:'Court order received. Hold publication until legal review is complete.',when:'enter'}},
 pause:{ending:true,title:'THE STORY STALLS',body:'You put the investigation on hold. The legal team buys some time, but the source goes quiet.\n\nThere may still be a story. You’ll need to find another way in.'},
 lost:{ending:true,title:'YOU NEVER OPENED IT',body:'You bin the tip and go back to sleep.\n\nBy morning, another journalist is asking the questions you could have asked.\n\nStill, there’s a missing cat story that needs chasing.'},
 blocked:{ending:true,title:'BLOCKED',body:'The billionaire calls you a “jealous, irrelevant dinosaur” to millions of followers.\n\nYour accounts are suddenly locked.\n\nFunny how quickly free speech can get switched off.'},
 inquiry:{ending:true,title:'THE LONG WAIT',body:'You call for an inquiry. There’s a brief burst of outrage, then months of delay.\n\nThe investigation stalls. The people involved carry on as usual.'},
 ghosted:{ending:true,title:'THE SOURCE GOES DARK',body:'You insist on going on the record. Your whistleblower stops replying.\n\nYou still have questions. No one left to answer them.',pop:{label:'ENCRYPTED MESSAGE',title:'Message not delivered',body:'This contact is no longer available.',when:'enter'}},
 hoax:{ending:true,title:'THE HOAX',body:'You publish before checking the source.\n\nThe documents fall apart under scrutiny. Your allegation doesn’t.\n\nYou’ve handed the billionaire everything he needs to discredit The Nerve.'},
 partial:{ending:true,title:'A PARTIAL VICTORY',body:'You publish only what you can prove and step away from the bigger lead.\n\nIt makes a dent. But the rest of the story stays buried.'},
 bought:{ending:true,title:'SILENCE HAS A PRICE',body:'The money arrives. Your mortgage is safe. The threats stop.\n\nThe evidence stays in a drawer. Someone else’s data is sold tomorrow.'},
 reckless:{ending:true,title:'A COSTLY MISTAKE',body:'You hit publish without waiting for legal advice.\n\nThe court comes down hard. The legal bill is catastrophic. The Nerve may not survive.\n\nYou had the story. You lost control of the ending.'},
 win:{ending:true,title:'YOU HELD YOUR NERVE',body:'You publish.\n\nThe documents have been checked. The threats haven’t stopped. Your home, relationship and reputation have taken a battering.\n\nThe billionaire denies everything. But now the public can see the evidence.\n\nYour phone buzzes.\n\nUNKNOWN: “I’ve got something else you should see.”'}
};
let current='intro',steps=0,queued=null;const area=document.getElementById('playarea'),overlay=document.getElementById('overlay');function escapeHTML(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function popup(p,cb){queued=cb;document.getElementById('poplabel').textContent=p.label;document.getElementById('poptitle').textContent=p.title;document.getElementById('poptext').textContent=p.body;overlay.classList.add('active')}document.getElementById('popclose').onclick=()=>{overlay.classList.remove('active');if(queued){let f=queued;queued=null;f()}};function render(){let s=scenes[current];const prog=Math.min(Math.round(steps/12*100),100);document.getElementById('progress').textContent=prog+'%';document.getElementById('fill').style.width=prog+'%';if(s.ending){area.innerHTML=`<div class="step">OUTCOME / ${escapeHTML(current)}</div><section class="ending"><div class="small">THE NERVE / END OF STORY</div><h2>${escapeHTML(s.title)}</h2><p>${escapeHTML(s.body)}</p><button onclick="reset()">PLAY AGAIN ↻</button></section>`}else{area.innerHTML=`<div class="step">${escapeHTML(s.title)}</div><div class="card" id="swipe"><div class="tag">THE NERVE / DECISION ${String(steps+1).padStart(2,'0')}</div><div class="story">${escapeHTML(s.body)}</div><div class="hint">← SWIPE LEFT OR RIGHT →</div></div><div class="choices"><button class="choice" onclick="choose(0)">← ${escapeHTML(s.options[0][0])}</button><button class="choice right" onclick="choose(1)">${escapeHTML(s.options[1][0])} →</button></div>`;let down=null,card=document.getElementById('swipe');card.addEventListener('pointerdown',e=>down=e.clientX);card.addEventListener('pointerup',e=>{if(down!==null){const d=e.clientX-down;if(Math.abs(d)>65)choose(d<0?0:1);down=null}})}if(s.pop&&s.pop.when==='enter')setTimeout(()=>{if(current===Object.keys(scenes).find(k=>scenes[k]===s))popup(s.pop,()=>{})},220)}function choose(n){let s=scenes[current];if(!s.options)return;const target=s.options[n][1];const next=()=>{current=target;steps++;render()};if(s.pop&&s.pop.when===(n===0?'left':'right'))popup(s.pop,next);else next()}function reset(){current='intro';steps=0;overlay.classList.remove('active');render()}document.getElementById('reset').onclick=reset;render();
</script></body></html>
