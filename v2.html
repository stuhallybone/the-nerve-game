<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Nerve | Wireframe Playtest V2</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#181818;background:#e9e9e9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}.shell{width:min(100%,480px);height:100dvh;margin:auto;display:flex;flex-direction:column;background:#f7f7f7;border-inline:1px solid #999;overflow:hidden}.top{padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:17px;font-weight:900;letter-spacing:-.06em}.stamp{font-size:10px;border:1px solid #555;padding:6px}.bar{padding:11px 18px 8px}.barline{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.05em}.track{margin-top:7px;height:5px;border:1px solid #333}.fill{height:100%;width:0%;background:#222;transition:width .3s}.status{font-size:10px;line-height:1.5;display:flex;gap:8px;flex-wrap:wrap;padding-top:9px}.status span{border:1px solid #777;padding:3px 5px}.main{flex:1;min-height:0;padding:8px 17px 10px;display:flex;flex-direction:column;gap:9px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em}.stage{position:relative;min-height:0;flex:1;display:flex}.card{width:100%;height:100%;border:2px solid #171717;background:#fff;padding:clamp(15px,3.2vh,25px);display:flex;flex-direction:column;justify-content:space-between;touch-action:pan-y;user-select:none;will-change:transform,opacity;box-shadow:5px 5px 0 #d7d7d7}.card.dragging{transition:none}.card.fly{transition:transform .23s ease-in,opacity .23s ease-in;opacity:0}.tag{font-size:10px;border:1px solid #777;display:inline-block;padding:5px 7px;align-self:flex-start}.body{font-size:clamp(16px,2.55vh,22px);font-family:Arial,Helvetica,sans-serif;line-height:1.32;font-weight:600;white-space:pre-line;overflow:auto;min-height:0;padding-block:12px}.title{font-size:clamp(19px,3.2vh,27px);letter-spacing:-.045em;font-weight:900;margin:0 0 8px}.dragcue{text-align:center;font-size:10px;color:#777;padding-top:6px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}.choose{padding:11px 8px;border:1.5px solid #222;min-height:70px;background:#fff;font-size:clamp(10px,1.6vh,12px);font-weight:800;text-transform:uppercase;line-height:1.25}.choose:active{background:#ddd}.footer{padding:4px 17px calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;justify-content:space-between;font-size:10px}.footer button{background:none;border:0;text-decoration:underline;font-size:10px;padding:5px}.veil{display:none;position:fixed;inset:0;z-index:5;background:#1119;align-items:center;justify-content:center;padding:24px}.veil.on{display:flex}.popup{width:min(100%,410px);background:#fdfdfd;border:2px solid #111;box-shadow:8px 8px 0 #333;padding:19px;animation:drop .2s ease-out}.popuphead{display:flex;justify-content:space-between;border-bottom:1px solid #aaa;padding-bottom:8px;font-size:10px}.popup h2{font:900 21px Arial,Helvetica,sans-serif;margin:18px 0 10px}.popup p{font:15px/1.45 Arial,Helvetica,sans-serif;white-space:pre-line}.popup button,.endbutton{width:100%;padding:14px;border:2px solid #111;background:#fff;font-weight:900;margin-top:12px}.end{height:100%;border:2px solid #111;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:#fff}.end h1{font:900 clamp(28px,5vh,44px)/.98 Arial,sans-serif;letter-spacing:-.05em}.end p{font:16px/1.4 Arial,sans-serif;white-space:pre-line;overflow:auto}.endstats{font-size:11px;line-height:1.8;border-block:1px solid #aaa;padding:10px 0}.toggle{border:1px solid #444;background:#fff;padding:4px 6px;font-size:10px}@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}@media(max-height:640px){.main{gap:6px}.bar{padding-block:6px}.status{padding-top:5px}.choose{min-height:54px}.top{padding-top:calc(env(safe-area-inset-top) + 7px)}}
</style></head><body>
<div class="shell"><header class="top"><div class="logo">THE NERVE <span style="font-weight:400">/ GAME</span></div><div class="stamp">WIREFRAME · V2</div></header><section class="bar"><div class="barline"><span>STORY PRESSURE</span><span id="progress">0 / 9</span></div><div class="track"><div id="fill" class="fill"></div></div><div class="status" id="stats"></div></section><main class="main"><div class="eyebrow" id="sceneLabel">DECISION 01 / 09</div><div class="stage" id="stage"></div><div class="choices" id="choices"></div></main><footer class="footer"><span>← SWIPE OR TAP →</span><span><button class="toggle" id="sound">SOUND ON</button> <button id="restart">RESTART</button></span></footer></div>
<div class="veil" id="veil" role="dialog" aria-modal="true"><section class="popup"><div class="popuphead"><strong id="popupSource">INCOMING MESSAGE</strong><span>● NEW</span></div><h2 id="popupTitle"></h2><p id="popupBody"></p><button id="popupClose">DISMISS →</button></section></div>
<script>
// Wireframe prototype: deliberately simple art direction, more complicated consequences.
// Two decisions, neither aligned with a fixed swipe direction. Outcomes depend on earlier choices.
const chapters=[
 {id:'tip',title:'2:13 AM. UNKNOWN NUMBER.',body:'“He’s selling private data. I can prove it. But you have to move fast.”\n\nAn attachment arrives. No sender. No explanation.',choices:[['OPEN IT ON YOUR PHONE','open'],['ISOLATE THE FILE FIRST','isolate']]},
 {id:'proof',title:'THERE’S SOMETHING HERE.',body:'The documents point towards a massive data sale. Your editor wants a headline by lunchtime.\n\nBut one crucial page is missing.',choices:[['GO PUBLIC WITH THE LEAD','post'],['VERIFY IT QUIETLY','verify']]},
 {id:'source',title:'THE SOURCE WANTS TO MEET.',body:'“No recording. No name. Not even your editor can know.”\n\nIf you agree, you could lose your only independent witness.',choices:[['DEMAND THEY GO ON RECORD','record'],['PROTECT THEIR IDENTITY','protect']]},
 {id:'lawyer',title:'THE LAWYERS ARRIVE.',body:'A billionaire’s solicitor threatens to bury The Nerve in legal bills.\n\nYour lawyer asks for 48 hours. Your editor says you might lose the scoop.',choices:[['GET THE LEGAL CHECK','legal'],['KEEP MOVING WITHOUT IT','rush']]},
 {id:'home',title:'ANOTHER MISSED DINNER.',body:'Your partner has left six messages. You promised tonight would be different.\n\nMeanwhile your source says they are being followed.',choices:[['GO HOME AND EXPLAIN','home'],['MEET THE SOURCE NOW','meet']]},
 {id:'funding',title:'THE PAPER CAN’T AFFORD THIS.',body:'Your publisher wants to pull the story. A wealthy backer offers to cover the costs, but insists on seeing the evidence first.\n\nYour savings could keep the investigation alive.',choices:[['ACCEPT THE BACKER','backer'],['FUND IT YOURSELF','self']]},
 {id:'threat',title:'YOUR ADDRESS IS ONLINE.',body:'Strangers know where you live. Your phone is lighting up.\n\nPolice advise you to secure your family before doing anything else.',choices:[['CONTINUE FROM THE NEWSROOM','continue'],['MOVE YOUR FAMILY TO SAFETY','safe']]},
 {id:'edit',title:'THE STORY IS READY. ALMOST.',body:'Your editor wants a name in the headline. One claim still relies on a single witness.\n\nYou can make a bigger splash or publish something narrower.',choices:[['PUBLISH THE BIG ALLEGATION','big'],['CUT WHAT YOU CAN’T PROVE','cut']]},
 {id:'final',title:'11:58 PM. TWO MINUTES.',body:'An emergency injunction has arrived. The legal team is calling. The editor is staring at you.\n\nThe publish button is waiting.',choices:[['PUBLISH THIS INSTANT','now'],['CHECK THE ORDER, THEN DECIDE','check']]}
];
const consequence={open:{security:-1,alert:['DEVICE SECURITY','Suspicious attachment opened','Your phone may now be compromised. Your source asks why you opened it on your personal device.']},isolate:{evidence:1},post:{evidence:-2,reach:1,alert:['SOCIAL NOTIFICATION','You are trending','The billionaire has accused The Nerve of fabricating documents. Your editor asks if you can prove your claim.']},verify:{evidence:2},record:{source:-2,alert:['ENCRYPTED MESSAGE','Message undelivered','The witness has deleted their account.']},protect:{source:2},legal:{security:2,reach:-1},rush:{security:-2,reach:1},home:{family:2,source:-1,alert:['MISSED CALL','SOURCE (3)','“I waited. They found me. Do not contact this number.”']},meet:{source:2,family:-2,alert:['MESSAGE · PARTNER','Are you coming home?','“I can’t keep doing this. Please just tell me you’re safe.”']},backer:{security:-2,evidence:-1,alert:['PRIVATE MESSAGE','A condition of the offer','The backer wants the witness’s name before transferring the money.']},self:{security:1,family:-2,alert:['BANK ALERT','Large withdrawal recorded','Your personal savings have been used to fund the investigation.']},continue:{security:-2,reach:1,alert:['UNKNOWN NUMBERS','18 new messages','“We know where your family lives.”']},safe:{security:2,reach:-1},big:{reach:2,evidence:-2},cut:{reach:-1,evidence:2},now:{security:-2,reach:1},check:{security:2}};
let i=0,values={},history=[],sound=true,modalQueue=[],locked=false,audioCtx=null;
const byId=x=>document.getElementById(x);
function init(){i=0;values={evidence:0,source:0,security:0,family:0,reach:0};history=[];modalQueue=[];locked=false;byId('veil').classList.remove('on');render()}
function beep(){if(!sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const start=audioCtx.currentTime;[0,0.11].forEach((delay,idx)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(idx?930:740,start+delay);gain.gain.setValueAtTime(.0001,start+delay);gain.gain.exponentialRampToValueAtTime(.075,start+delay+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+delay+.095);osc.connect(gain).connect(audioCtx.destination);osc.start(start+delay);osc.stop(start+delay+.1)})}catch(e){}}
function notify(source,title,body){modalQueue.push({source,title,body});showNext()}
function showNext(){if(!modalQueue.length||byId('veil').classList.contains('on'))return;let p=modalQueue.shift();byId('popupSource').textContent=p.source;byId('popupTitle').textContent=p.title;byId('popupBody').textContent=p.body;byId('veil').classList.add('on');beep()}
byId('popupClose').onclick=()=>{byId('veil').classList.remove('on');setTimeout(showNext,100)};
function getLabel(x){return x>0?'+'+x:String(x)}
function updateStatus(){byId('progress').textContent=Math.min(i+1,9)+' / 9';byId('fill').style.width=(Math.min(i+1,9)/9*100)+'%';byId('stats').innerHTML=['evidence','source','security','family'].map(k=>`<span>${k.toUpperCase()} ${getLabel(values[k])}</span>`).join('')}
function render(){updateStatus();if(i>=chapters.length){finish();return;}let s=chapters[i];byId('sceneLabel').textContent=`DECISION ${String(i+1).padStart(2,'0')} / 09`;byId('stage').innerHTML=`<article class="card" id="card"><div class="tag">[ STORY NODE: ${s.id.toUpperCase()} ]</div><div class="body"><h1 class="title">${s.title}</h1>${s.body.replaceAll('\n','<br>')}</div><div class="dragcue">DRAG CARD LEFT OR RIGHT</div></article>`;byId('choices').innerHTML=s.choices.map(([label],n)=>`<button class="choose" data-choice="${n}">${n?'→':'←'} ${label}</button>`).join('');byId('choices').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));let el=byId('card'),x=0,drag=false;el.addEventListener('pointerdown',e=>{if(e.target.closest('.body')&&e.pointerType==='mouse'){}drag=true;x=e.clientX;el.setPointerCapture(e.pointerId);el.classList.add('dragging')});el.addEventListener('pointermove',e=>{if(!drag)return;let d=e.clientX-x;el.style.transform=`translateX(${Math.max(-130,Math.min(130,d))}px) rotate(${d/28}deg)`});el.addEventListener('pointerup',e=>{if(!drag)return;drag=false;el.classList.remove('dragging');let d=e.clientX-x;if(Math.abs(d)>60)choose(d<0?0:1);else el.style.transform='';});el.addEventListener('pointercancel',()=>{drag=false;el.style.transform='';});}
function choose(n){if(locked||i>=chapters.length)return;locked=true;let chapter=chapters[i],effect=consequence[chapter.choices[n][1]],el=byId('card');history.push({scene:chapter.id,choice:chapter.choices[n][0]});for(let k of Object.keys(values))values[k]+=effect[k]||0;el.style.transform=`translateX(${n?'+':'-'}125vw) rotate(${n?16:-16}deg)`;el.classList.add('fly');setTimeout(()=>{i++;render();locked=false;if(effect.alert)notify(...effect.alert);if(i===7)notify('EDITORIAL DESK','Fact check update',values.evidence<1?'We have gaps in the evidence. Proceed carefully.':'The paper trail is holding up. The lawyers still have questions.');},245)}
function finish(){byId('sceneLabel').textContent='OUTCOME / YOUR VERSION OF THE STORY';byId('choices').innerHTML='';let score=values.evidence+values.source+values.security;let good=score>=3&&values.evidence>=1,reckless=values.evidence<0||values.security<=-4;let headline=good?'THE STORY GETS OUT':reckless?'YOU HAD THE STORY. THEN LOST IT.':'THE TRUTH COMES OUT IN PIECES';let desc=good?'Your evidence survives scrutiny. The story is published and the billionaire faces questions he cannot easily dodge.':reckless?'The allegations trigger a backlash, but the holes in your reporting give the billionaire a way to attack the entire investigation.':'You publish a narrower, defensible account. It starts a conversation, but the central allegation remains unresolved.';let cost=values.family<=-3?'Your relationship is in serious trouble.':values.family<0?'Your family paid a price for your choices.':'You made time to protect the people closest to you.';let src=values.source<0?'Your source disappeared.':values.source>0?'Your source remained protected.':'Your source’s position is uncertain.';byId('stage').innerHTML=`<section class="end"><div><div class="tag">[ PLAYTEST END / NOT A SCORECARD ]</div><h1>${headline}</h1><p>${desc}\n\n${cost}\n${src}\n\nThere is no clean victory here.</p></div><div><div class="endstats">EVIDENCE ${getLabel(values.evidence)} · SOURCE ${getLabel(values.source)}<br>LEGAL / SAFETY ${getLabel(values.security)} · HOME ${getLabel(values.family)}<br>PUBLIC IMPACT ${getLabel(values.reach)}</div><button class="endbutton" onclick="init()">PLAY AGAIN ↻</button></div></section>`;byId('progress').textContent='9 / 9';byId('fill').style.width='100%'}
byId('restart').onclick=init;byId('sound').onclick=()=>{sound=!sound;byId('sound').textContent=sound?'SOUND ON':'SOUND OFF';if(sound)beep()};init();
</script></body></html>
